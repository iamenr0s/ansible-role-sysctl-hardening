---
- name: Gather sysctl state
  ansible.builtin.include_tasks: facts.yml

- name: Look at the persistent file
  ansible.builtin.stat:
    path: "{{ linux_hardening_sysctl_dropin }}"
  register: __lh_sysctl_file

- name: Read the persistent file
  ansible.builtin.slurp:
    src: "{{ linux_hardening_sysctl_dropin }}"
  register: __lh_sysctl_content
  when: __lh_sysctl_file.stat.exists

- name: Compare running values with desired state
  ansible.builtin.set_fact:
    __lh_sysctl_findings: >-
      {%- set drift = __lh_sysctl_state | rejectattr('match') | list -%}
      {{ (drift | rejectattr('key', 'in', __lh_sysctl_failed | default([])) | map('combine', {'fixable': true}) | list)
         + (drift | selectattr('key', 'in', __lh_sysctl_failed | default([])) | map('combine', {'fixable': false}) | list) }}

- name: Add a finding when the persistent file is missing or different
  ansible.builtin.set_fact:
    __lh_sysctl_findings: "{{ __lh_sysctl_findings + [__lh_sysctl_file_finding] }}"
  vars:
    __lh_sysctl_file_finding:
      key: "persistent file {{ linux_hardening_sysctl_dropin }}"
      expected: present with the desired values
      actual: missing or different
      fixable: true
  when: >-
    not __lh_sysctl_file.stat.exists
    or (__lh_sysctl_content.content | b64decode) != lookup('ansible.builtin.template', 'sysctl.conf.j2')
    or __lh_sysctl_file.stat.mode != '0644'

- name: Record findings
  ansible.builtin.set_fact:
    linux_hardening_sysctl_findings: "{{ __lh_sysctl_findings }}"
    linux_hardening_sysctl_unavailable: "{{ __lh_sysctl_unavailable }}"

- name: Report sysctl_hardening result
  ansible.builtin.debug:
    msg: >-
      {{ 'COMPLIANT' if linux_hardening_sysctl_findings | length == 0 else linux_hardening_sysctl_findings }}
      (not present on this kernel, skipped: {{ linux_hardening_sysctl_unavailable | length }})

# After remediation only fixable findings fail the run; keys the kernel refused to set need a human.
- name: Fail on findings
  ansible.builtin.fail:
    msg: "sysctl_hardening found {{ __lh_sysctl_blocking | length }} deviation(s)."
  vars:
    __lh_sysctl_post_remediation: "{{ __lh_sysctl_audit_fatal | default(false) }}"
    __lh_sysctl_blocking: >-
      {{ linux_hardening_sysctl_findings | selectattr('fixable') | list
         if __lh_sysctl_post_remediation
         else (linux_hardening_sysctl_findings if linux_hardening_fail_on_error | bool else []) }}
  when: __lh_sysctl_blocking | length > 0
