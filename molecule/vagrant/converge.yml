---
- name: Converge (remediate on a real kernel, no ignore_errors)
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Remediate
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../.."  # noqa: role-name[path]
      vars:
        linux_hardening_mode: remediate
        linux_hardening_confirm_remediation: true
        linux_hardening_profile: cis_level2
        linux_hardening_sysctl_confirm_disable_forwarding: true
