---
# Containers cannot write /proc/sys, so ignore_errors is needed; the persistent file is still written.
- name: Converge (remediate)
  hosts: all
  become: false
  gather_facts: true
  tasks:
    - name: Remediate
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../.."  # noqa: role-name[path]
      vars:
        linux_hardening_mode: remediate
        linux_hardening_confirm_remediation: true
        linux_hardening_sysctl_ignore_errors: true
        linux_hardening_sysctl_confirm_disable_forwarding: true   # host forwarding state varies (libvirt turns it on)
        linux_hardening_sysctl_extra: {vm.swappiness: 10}
        linux_hardening_sysctl_overrides: {fs.suid_dumpable: null}
