---
# Regression: switching ip_forward off resets accept_redirects in the kernel, so it must be written first.
- name: Prepare (forwarding on)
  hosts: all
  become: false
  gather_facts: false
  tasks:
    - name: Turn IPv4 forwarding on
      ansible.builtin.command: sysctl -w net.ipv4.ip_forward=1
      changed_when: false
      failed_when: false
