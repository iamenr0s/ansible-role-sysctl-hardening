---
- name: Converge (audit only)
  hosts: all
  become: false
  gather_facts: true
  tasks:
    - name: Audit
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../.."  # noqa: role-name[path]
      vars:
        linux_hardening_mode: audit
        linux_hardening_fail_on_error: false

    - name: Findings include the missing persistent file
      ansible.builtin.assert:
        that: linux_hardening_sysctl_findings | selectattr('key', 'search', '^persistent file') | list | length == 1
        quiet: true

    - name: Nothing was written
      ansible.builtin.stat:
        path: /etc/sysctl.d/99-zz-linux-hardening.conf
      register: __f
      failed_when: __f.stat.exists
